# --- Role Configuration ---
process.roles=broker,controller
# CHANGE THIS: 1, 2, or 3 depending on the server
node.id=1 

# CHANGE THIS: Must include ALL 3 nodes 
controller.quorum.voters=<voter-string>

# --- Listeners ---
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
inter.broker.listener.name=PLAINTEXT
# CHANGE THIS: The Private IP of THIS specific server
advertised.listeners=PLAINTEXT://kf1:9092
controller.listener.names=CONTROLLER

# --- Security ---
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

# --- Logs & Storage ---
log.dirs=/data/kafka
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# --- Others ---
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true
